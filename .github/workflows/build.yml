name: Build1 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project
        run: |
          if [ -f moneytrack-src.zip ]; then unzip -q moneytrack-src.zip -d _src; fi
          if [ -d _src/moneytrack ]; then echo "PROJ=_src/moneytrack" >> "$GITHUB_ENV"; else echo "PROJ=." >> "$GITHUB_ENV"; fi

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '### Build errors'
              echo '```'
              grep -nE '^e: |error:|What went wrong|FAILED|Unresolved|Could not|Execution failed' -A4 build.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
